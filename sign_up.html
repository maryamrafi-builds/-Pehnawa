            <!-- to deviate on the other page when all field input are correct then write,action="abc.html" inside form tag-->
        <form action="signup.jsp" method="post" onsubmit="return data()">  
            <div class="form-group">
                <label for="Username"></label>
                <input type="text" id="username" name="username" placeholder="Enter Username" required>
                <small id="usernameMessage"></small>

            </div>
            <div class="form-group">
                <label for="email"></label>
                <input type="email" id="email" name="email" placeholder="Enter your Email" required>
                <small id="emailMessage"></small>
            </div>

            <div class="form-group">
                <label for="phone number"></label>
                <input type="tel" id="phone" name="phone" placeholder="Enter Phone no." maxlength="11" required>
                <small id="phoneMessage"></small>
            </div>

            <div class="form-group">
                <label for="password" ></label>
                <input type="password" id="password" name="password" placeholder="Enter Password" required >
                <small id="passwordMessage" ></small>
            </div>
           

            <button type="submit" >Sign up</button>

              <div class="or_line">
           <span>OR</span>
            </div>
