<!DOCTYPE html>
<html lang="en">
<head>
   
    <title>sign_up</title>
    <link rel="stylesheet" href="sign_up.css">
    <script src="sign_up.js" defer></script>
     <link rel="stylesheet" href="images/font/icon/css/all.min.css">
    <link rel="stylesheet" href="images/font/icon/css/fontawesome.min.css">

</head>
<body>
   <header class="header">
    <div class="logo"> 
    <img src="logo2.png" alt="PEHNAWA">
    </div>
   

    <div  class="header-icons">
       
 <nav>
        <a href="homepage.html"><i class="fa-solid fa-arrow-left-long" ></i> Back to Home</a>
 </nav>
        </div>
</header> 
 
    <div class="container anim">
               <div class="logo ">PEHNAWA</div>

        <p class="subtitle">
           WHERE HERITAGE MEETS STYLE
        </p> 
            <!-- to deviate on the other page when all field input are correct then write,action="abc.html" inside form tag-->
        <form action="signup.jsp" method="post" onsubmit="return data()">  
            <div class="form-group">
                <label for="Username"></label>
                <input type="text" id="username" name="username" placeholder="Enter Username" required>
                <small id="usernameMessage"></small>

            </div>
            <div class="form-group">
                <label for="email"></label>
                <input type="email" id="email" name="email" placeholder="Enter your Email" required>
                <small id="emailMessage"></small>
                 <p id="email-error" class="error-message"></p> <!--for error msg -->
            </div>

            <div class="form-group">
                <label for="phone number"></label>
                <input type="number" id="phone" name="phone" placeholder="Enter Phone no." maxlength="11" required>
                <small id="phoneMessage"></small>
            </div>

            <div class="form-group">
                <label for="password" ></label>
                <input type="password" id="password" name="password" placeholder="Enter Password" required >
                <small id="passwordMessage" ></small>
            </div>
           

            <button type="submit" >Sign up</button>

              <div class="or_line">
           <span>OR</span>
            </div>
             
        <div class="login-link">
        <p>
            Already have account? 
            <a href="login.html" class="link">Log in</a> 
        </p> 
        </div>     

        </form>

    </div>
    
    <script>

                const params = new URLSearchParams(window.location.search);

                const error = params.get("error");

                const errorMessage = document.getElementById("email-error");

                if (error === "exists") {
                    errorMessage.textContent =
                        "This email is already registered. Please log in.";
                }

                else if (error === "failed") {
                    errorMessage.textContent =
                        "Registration failed. Please try again.";
                }

    </script>
    
</body>
</html>
