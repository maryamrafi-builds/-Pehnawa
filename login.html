<!DOCTYPE html>  
<html>   
<head>
    <title>Login page</title>

   <link rel="stylesheet" href="login.css">

    <link rel="stylesheet" href="images/font/icon/css/all.min.css">

<body>
<header class="header">

    <div  class="header-icons">
       
 <nav>
        <a href="homepage.html"><i class="fa-solid fa-arrow-left-long" ></i> Back to Home</a>
 </nav>
        </div>
</header>     

    <div class="container anim">
        <div class="logo">PEHNAWA</div>

        <p class="subtitle">

        <form action="login.jsp" method="post" onsubmit="return data()">

                <input type="email" id="email" name="email" placeholder="Enter your Email" >

            </div>

            <div class="form-group">
                <input type="password" id="password" name="password" placeholder="Enter Password" >
                <small id="passwordMessage"></small>
            </div>
           
 <div class="button">
            <button type="submit">Login</button>
            </div>
             
            <div class="or_line">
           <span>OR</span>
            </div>

    <div class="signup-link">
        <p>
            Don't have an account? 
            <a href="sign_up.html" class="link">Sign up</a>

    </div>
       

        </form>

    </div>



</body>
